<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#f4f4f3"/>
    </linearGradient>
    <radialGradient id="recordGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff453a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="44" fill="#fafaf9"/>
  <line x1="0" y1="44" x2="960" y2="44" stroke="rgba(0,0,0,0.06)"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>

  <!-- Sidebar -->
  <rect x="0" y="44" width="200" height="636" fill="#fafaf9"/>
  <line x1="200" y1="44" x2="200" y2="680" stroke="rgba(0,0,0,0.06)"/>

  <!-- App brand in sidebar -->
  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="24" height="24" rx="7" fill="#1a1a1d"/>
    <!-- Mini mic icon -->
    <rect x="9" y="6" width="6" height="10" rx="3" fill="#fafaf9"/>
    <rect x="4" y="11" width="16" height="6" rx="3" fill="none" stroke="#fafaf9" stroke-width="1.2"/>
    <rect x="11" y="16" width="2" height="3" fill="#fafaf9"/>
    <rect x="6" y="18" width="12" height="2" rx="1" fill="#fafaf9"/>
    <text x="36" y="17" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1a1a1d">VoxForge</text>
  </g>

  <!-- Nav items -->
  <g font-family="Helvetica Neue" font-size="13" font-weight="450">
    <g transform="translate(16, 120)">
      <rect x="0" y="0" width="168" height="32" rx="8" fill="#ececeb"/>
      <rect x="12" y="10" width="12" height="12" rx="2" fill="#1a1a1d"/>
      <text x="34" y="20" fill="#1a1a1d" font-weight="500">Dictation</text>
    </g>
    <g transform="translate(16, 158)">
      <circle cx="18" cy="16" r="6" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">History</text>
    </g>
    <g transform="translate(16, 196)">
      <rect x="12" y="9" width="12" height="14" rx="1" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Dictionary</text>
    </g>
    <g transform="translate(16, 234)">
      <path d="M 18 10 L 18 22 M 12 16 L 24 16" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
      <text x="34" y="20" fill="#71717a">Models</text>
    </g>
    <g transform="translate(16, 272)">
      <path d="M 14 12 L 22 12 L 22 20 L 14 20 Z M 12 16 L 24 16" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Stats</text>
    </g>
    <g transform="translate(16, 310)">
      <path d="M 18 8 L 24 12 L 24 18 L 18 22 L 12 18 L 12 12 Z" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Privacy</text>
    </g>
    <g transform="translate(16, 348)">
      <circle cx="18" cy="16" r="6" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Settings</text>
    </g>
  </g>

  <!-- Sidebar footer -->
  <text x="24" y="660" font-family="Menlo" font-size="11" fill="#a1a1aa">v1.0.0</text>

  <!-- Main content -->
  <g transform="translate(232, 76)">
    <!-- Hero record button area -->
    <g transform="translate(364, 100)">
      <!-- Outer glow ring (recording state) -->
      <circle cx="0" cy="0" r="56" fill="url(#recordGlow)"/>
      <!-- Main button -->
      <circle cx="0" cy="0" r="36" fill="#ff453a"/>
      <!-- Stop icon (rounded square) -->
      <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#fafaf9"/>
    </g>

    <!-- Status label -->
    <text x="364" y="220" text-anchor="middle" font-family="Helvetica Neue" font-size="13" font-weight="450" fill="#71717a">Listening...</text>

    <!-- Last transcription card -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="728" height="78" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="26" font-family="Helvetica Neue" font-size="11" font-weight="500" fill="#0358f7">LAST TRANSCRIPTION</text>
      <text x="20" y="56" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">The quick brown fox jumps over the lazy dog and then goes for a walk in the park.</text>
    </g>

    <!-- Recent section header -->
    <text x="0" y="386" font-family="Helvetica Neue" font-size="11" font-weight="500" fill="#a1a1aa">RECENT</text>

    <!-- Recent cards -->
    <g transform="translate(0, 402)">
      <rect x="0" y="0" width="728" height="62" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="30" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Ship the dashboard refactor and update the changelog.</text>
      <text x="20" y="50" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">2 minutes ago · 8 words · 4.2s</text>
    </g>

    <g transform="translate(0, 474)">
      <rect x="0" y="0" width="728" height="62" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="30" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Add a one-click permission flow for accessibility and microphone.</text>
      <text x="20" y="50" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">8 minutes ago · 11 words · 6.1s · TextEdit</text>
    </g>

    <g transform="translate(0, 546)">
      <rect x="0" y="0" width="728" height="62" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="30" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Make sure the global shortcut works across all apps and the focus returns correctly.</text>
      <text x="20" y="50" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">12 minutes ago · 14 words · 7.3s</text>
    </g>
  </g>

  <!-- Status badge top right -->
  <g transform="translate(880, 76)">
    <circle cx="-58" cy="22" r="3.5" fill="#22c55e"/>
    <text x="-48" y="26" font-family="Helvetica Neue" font-size="12" font-weight="450" fill="#a1a1aa">Ready</text>
  </g>
</svg>
