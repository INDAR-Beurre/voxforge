<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ff4d00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Ember glow center -->
  <ellipse cx="640" cy="300" rx="500" ry="280" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Sound waves on left -->
  <g fill="none" stroke-linecap="round">
    <path d="M 220 270 Q 160 320 220 370" stroke="#ff7a2e" stroke-width="6" opacity="0.6"/>
    <path d="M 180 240 Q 100 320 180 400" stroke="#ff7a2e" stroke-width="5" opacity="0.4"/>
  </g>
  <!-- Sound waves on right -->
  <g fill="none" stroke-linecap="round">
    <path d="M 1060 270 Q 1120 320 1060 370" stroke="#ff7a2e" stroke-width="6" opacity="0.6"/>
    <path d="M 1100 240 Q 1180 320 1100 400" stroke="#ff7a2e" stroke-width="5" opacity="0.4"/>
  </g>

  <!-- App icon large -->
  <g transform="translate(540, 90)">
    <rect x="0" y="0" width="200" height="200" rx="46" ry="46" fill="#1f1f23"/>
    <rect x="0" y="0" width="200" height="200" rx="46" ry="46" fill="url(#glow)"/>
    <!-- Outer waves -->
    <path d="M 50 70 Q 26 100 50 130" stroke="#ff7a2e" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 150 70 Q 174 100 150 130" stroke="#ff7a2e" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- Inner waves -->
    <path d="M 62 80 Q 44 100 62 120" stroke="#ffa554" stroke-width="6.8" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 138 80 Q 156 100 138 120" stroke="#ffa554" stroke-width="6.8" fill="none" stroke-linecap="round" opacity="0.95"/>
    <!-- Yoke -->
    <path d="M 64 95 Q 64 140 100 140 Q 136 140 136 95" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Mic body -->
    <rect x="80" y="44" width="40" height="84" rx="20" ry="20" fill="#ffffff"/>
    <!-- Grille lines -->
    <rect x="89" y="64" width="22" height="1.2" rx="0.6" fill="#d0d0d8"/>
    <rect x="89" y="76" width="22" height="1.2" rx="0.6" fill="#d0d0d8"/>
    <rect x="89" y="88" width="22" height="1.2" rx="0.6" fill="#d0d0d8"/>
    <rect x="89" y="100" width="22" height="1.2" rx="0.6" fill="#d0d0d8"/>
    <!-- Pole -->
    <rect x="97" y="138" width="6" height="20" rx="1" fill="#ffffff"/>
    <!-- Base -->
    <rect x="76" y="156" width="48" height="6" rx="3" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="370" text-anchor="middle" font-family="Helvetica Neue" font-size="72" font-weight="700" fill="#ffffff">VoxForge</text>

  <!-- Tagline -->
  <text x="640" y="420" text-anchor="middle" font-family="Helvetica Neue" font-size="22" font-weight="400" fill="#a1a1aa">Privacy-first voice dictation for macOS</text>

  <!-- Sub-tagline -->
  <text x="640" y="460" text-anchor="middle" font-family="Helvetica Neue" font-size="17" font-weight="450" fill="#71717a">Speak naturally. Text appears anywhere.</text>

  <!-- Bottom badges row -->
  <g font-family="Helvetica Neue" font-size="13" font-weight="500">
    <g transform="translate(640, 555)">
      <g transform="translate(-290, 0)">
        <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#d4d4d8">On-device Whisper</text>
      </g>
      <g transform="translate(-110, 0)">
        <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#d4d4d8">Push to talk</text>
      </g>
      <g transform="translate(70, 0)">
        <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#d4d4d8">Auto-detect</text>
      </g>
      <g transform="translate(250, 0)">
        <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#d4d4d8">100% local</text>
      </g>
    </g>
  </g>
</svg>
