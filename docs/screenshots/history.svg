<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#f4f4f3"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="url(#bg2)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="44" fill="#fafaf9"/>
  <line x1="0" y1="44" x2="960" y2="44" stroke="rgba(0,0,0,0.06)"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>

  <!-- Sidebar -->
  <rect x="0" y="44" width="200" height="636" fill="#fafaf9"/>
  <line x1="200" y1="44" x2="200" y2="680" stroke="rgba(0,0,0,0.06)"/>

  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="24" height="24" rx="7" fill="#1a1a1d"/>
    <text x="36" y="17" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1a1a1d">VoxForge</text>
  </g>

  <g font-family="Helvetica Neue" font-size="13" font-weight="450">
    <g transform="translate(16, 120)">
      <circle cx="18" cy="16" r="6" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Dictation</text>
    </g>
    <g transform="translate(16, 158)">
      <rect x="0" y="0" width="168" height="32" rx="8" fill="#ececeb"/>
      <rect x="12" y="10" width="12" height="12" rx="2" fill="none" stroke="#1a1a1d" stroke-width="1.5"/>
      <text x="34" y="20" fill="#1a1a1d" font-weight="500">History</text>
    </g>
    <g transform="translate(16, 196)">
      <rect x="12" y="9" width="12" height="14" rx="1" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Dictionary</text>
    </g>
    <g transform="translate(16, 234)">
      <path d="M 18 10 L 18 22 M 12 16 L 24 16" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
      <text x="34" y="20" fill="#71717a">Models</text>
    </g>
    <g transform="translate(16, 272)">
      <path d="M 14 12 L 22 12 L 22 20 L 14 20 Z M 12 16 L 24 16" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Stats</text>
    </g>
    <g transform="translate(16, 310)">
      <path d="M 18 8 L 24 12 L 24 18 L 18 22 L 12 18 L 12 12 Z" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Privacy</text>
    </g>
    <g transform="translate(16, 348)">
      <circle cx="18" cy="16" r="6" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <text x="34" y="20" fill="#71717a">Settings</text>
    </g>
  </g>

  <text x="24" y="660" font-family="Menlo" font-size="11" fill="#a1a1aa">v1.0.0</text>

  <!-- Main content -->
  <g transform="translate(232, 76)">
    <!-- Header -->
    <text x="0" y="22" font-family="Helvetica Neue" font-size="22" font-weight="600" fill="#1a1a1d">History</text>
    <text x="0" y="44" font-family="Helvetica Neue" font-size="13" font-weight="450" fill="#71717a">All your transcriptions, searchable and exportable.</text>

    <!-- Search bar -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="728" height="40" rx="10" fill="#ececeb"/>
      <circle cx="22" cy="20" r="5" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <line x1="26" y1="24" x2="30" y2="28" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="25" font-family="Helvetica Neue" font-size="13" font-weight="450" fill="#a1a1aa">Search transcriptions…</text>
    </g>

    <!-- Group header: Today -->
    <text x="0" y="148" font-family="Helvetica Neue" font-size="11" font-weight="500" fill="#a1a1aa">TODAY</text>

    <!-- Transcription card -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="728" height="74" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="32" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">The quick brown fox jumps over the lazy dog and then goes for a walk in the park.</text>
      <text x="20" y="56" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">2 minutes ago · 16 words · 4.2s</text>
      <!-- Action icons -->
      <g transform="translate(672, 28)">
        <rect x="0" y="-6" width="12" height="12" rx="2" fill="none" stroke="#71717a" stroke-width="1.3"/>
        <g transform="translate(24, 0)">
          <path d="M 0 0 L 4 -4 L 8 0 L 4 4 Z" fill="#ffb005"/>
        </g>
        <g transform="translate(48, 0)">
          <path d="M 0 -4 L 8 -4 L 8 4 L 0 4 Z" fill="none" stroke="#71717a" stroke-width="1.3"/>
        </g>
      </g>
    </g>

    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="728" height="74" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="32" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Ship the dashboard refactor and update the changelog with all the new permission flows.</text>
      <text x="20" y="56" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">8 minutes ago · 14 words · 6.1s · TextEdit</text>
      <g transform="translate(672, 28)">
        <rect x="0" y="-6" width="12" height="12" rx="2" fill="none" stroke="#71717a" stroke-width="1.3"/>
        <g transform="translate(48, 0)">
          <path d="M 0 -4 L 8 -4 L 8 4 L 0 4 Z" fill="none" stroke="#71717a" stroke-width="1.3"/>
        </g>
      </g>
    </g>

    <g transform="translate(0, 332)">
      <rect x="0" y="0" width="728" height="74" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="32" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Add a one-click permission flow for accessibility and microphone so users don't have to dig through system settings.</text>
      <text x="20" y="56" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">12 minutes ago · 20 words · 7.3s</text>
      <g transform="translate(672, 28)">
        <rect x="0" y="-6" width="12" height="12" rx="2" fill="none" stroke="#71717a" stroke-width="1.3"/>
        <g transform="translate(24, 0)">
          <path d="M 0 0 L 4 -4 L 8 0 L 4 4 Z" fill="#ffb005"/>
        </g>
        <g transform="translate(48, 0)">
          <path d="M 0 -4 L 8 -4 L 8 4 L 0 4 Z" fill="none" stroke="#71717a" stroke-width="1.3"/>
        </g>
      </g>
    </g>

    <!-- Group header: Yesterday -->
    <text x="0" y="438" font-family="Helvetica Neue" font-size="11" font-weight="500" fill="#a1a1aa">YESTERDAY</text>

    <g transform="translate(0, 454)">
      <rect x="0" y="0" width="728" height="74" rx="14" fill="#fafaf9" stroke="rgba(0,0,0,0.06)"/>
      <text x="20" y="32" font-family="Helvetica Neue" font-size="14" fill="#1a1a1d">Make sure the global shortcut works across all apps and the focus returns correctly to the previous app.</text>
      <text x="20" y="56" font-family="Helvetica Neue" font-size="12" fill="#a1a1aa">Yesterday at 4:32 PM · 18 words · 8.4s · VS Code</text>
      <g transform="translate(672, 28)">
        <rect x="0" y="-6" width="12" height="12" rx="2" fill="none" stroke="#71717a" stroke-width="1.3"/>
        <g transform="translate(48, 0)">
          <path d="M 0 -4 L 8 -4 L 8 4 L 0 4 Z" fill="none" stroke="#71717a" stroke-width="1.3"/>
        </g>
      </g>
    </g>
