<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <radialGradient id="ember" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Simulated desktop background -->
  <rect width="600" height="200" fill="#0a0a0c"/>
  <ellipse cx="300" cy="200" rx="500" ry="200" fill="url(#ember)"/>
  <!-- Simulated code editor in background (very subtle) -->
  <g opacity="0.15" font-family="Menlo" font-size="10" fill="#a1a1aa">
    <text x="20" y="30">fn transcribe(audio: Vec&lt;f32&gt;) -&gt; Result&lt;String&gt; {</text>
    <text x="40" y="50">  let text = whisper.run(audio)?;</text>
    <text x="40" y="70">  let cleaned = postprocess::apply(text);</text>
    <text x="20" y="90">}</text>
  </g>

  <!-- Widget at bottom center -->
  <g transform="translate(220, 130)">
    <!-- Pill background -->
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(30,30,32,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(255,255,255,0.02)"/>

    <!-- Pulsing red dot -->
    <circle cx="20" cy="20" r="5" fill="#ff453a"/>
    <circle cx="20" cy="20" r="5" fill="#ff453a" opacity="0.4">
      <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Waveform bars (9 of them) -->
    <g transform="translate(40, 20)">
      <rect x="0" y="-6" width="2" height="12" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="6" y="-9" width="2" height="18" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="12" y="-4" width="2" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="18" y="-10" width="2" height="20" rx="1" fill="rgba(255,255,255,0.85)"/>
      <rect x="24" y="-6" width="2" height="12" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="30" y="-12" width="2" height="24" rx="1" fill="rgba(255,255,255,0.9)"/>
      <rect x="36" y="-5" width="2" height="10" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="42" y="-9" width="2" height="18" rx="1" fill="rgba(255,255,255,0.8)"/>
      <rect x="48" y="-3" width="2" height="6" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="54" y="-7" width="2" height="14" rx="1" fill="rgba(255,255,255,0.75)"/>
      <rect x="60" y="-11" width="2" height="22" rx="1" fill="rgba(255,255,255,0.85)"/>
      <rect x="66" y="-4" width="2" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="72" y="-8" width="2" height="16" rx="1" fill="rgba(255,255,255,0.8)"/>
      <rect x="78" y="-5" width="2" height="10" rx="1" fill="rgba(255,255,255,0.7)"/>
      <rect x="84" y="-10" width="2" height="20" rx="1" fill="rgba(255,255,255,0.85)"/>
      <rect x="90" y="-6" width="2" height="12" rx="1" fill="rgba(255,255,255,0.7)"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="300" y="190" text-anchor="middle" font-family="Helvetica Neue" font-size="12" font-weight="450" fill="#71717a">Floating widget — appears on record, hides on stop</text>
</svg>
