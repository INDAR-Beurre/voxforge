<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232328"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="ember" cx="512" cy="1024" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff4d00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- Forge ember glow from bottom -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#ember)"/>

  <!-- Outer sound waves (subtle) -->
  <path d="M 250 360 Q 130 512 250 664" stroke="#ff7a2e" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M 774 360 Q 894 512 774 664" stroke="#ff7a2e" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- Inner sound waves (bright) -->
  <path d="M 320 410 Q 230 512 320 614" stroke="#ffa554" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 704 410 Q 794 512 704 614" stroke="#ffa554" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.95"/>

  <!-- Mic yoke (U-shape stand) -->
  <path d="M 330 480 Q 330 720 512 720 Q 694 720 694 480" stroke="#ffffff" stroke-width="40" fill="none" stroke-linecap="round"/>

  <!-- Mic body (rounded capsule) -->
  <rect x="412" y="220" width="200" height="420" rx="100" ry="100" fill="#ffffff"/>

  <!-- Mic grille lines -->
  <rect x="446" y="320" width="132" height="6" rx="3" fill="#d0d0d8"/>
  <rect x="446" y="380" width="132" height="6" rx="3" fill="#d0d0d8"/>
  <rect x="446" y="440" width="132" height="6" rx="3" fill="#d0d0d8"/>
  <rect x="446" y="500" width="132" height="6" rx="3" fill="#d0d0d8"/>

  <!-- Mic pole -->
  <rect x="488" y="710" width="48" height="110" rx="8" fill="#ffffff"/>

  <!-- Mic base -->
  <rect x="380" y="810" width="264" height="38" rx="19" fill="#ffffff"/>
</svg>
